# Node runs requests on one thread, so scale with replicas rather than CPUs.
replicaCount: 2

# Repository for where to get the image
image:
  repository: your-repository
  tag: 0.0.5
  name: sequence-classifier

# Resources for the builder container
resources:
  requests:
    memory: 8Gi
    cpu: 1
  limits:
    memory: 8Gi
    cpu: 1
 
# If an ingress should be created
ingress:
  enabled: false
  # Base of the ingress so you can provide a different base url than normal
  base: sequence-classifier

  # Domain to create the ingress entry with
  domain: some-domain.org

# port number to expose
service: 
  port: 3000
  targetPort: 3000
  nodePort: 31300

# Node selector
nodeSelector: 

# Probe settings
# The service itself starts in seconds; vsearch readiness is covered by the
# readiness probe, not by delaying startup.
startup:
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 5
  
liveness:
  failureThreshold: 3
  periodSeconds: 30
  timeoutSeconds: 5

readiness:
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 5

# Must exceed shutdownTimeoutMs.
terminationGracePeriodSeconds: 165

# Node affinity
nodeAffinity:

# Pod anti affinity
podAntiAffinity:
  preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vsearch
        topologyKey: kubernetes.io/hostname


# Annotation for the builder pod
podAnnotations:

# If the builder pod should use yunikorn
yunikorn:
  enabled: false
  # Name of the overall application for all the pods within the queue
  appId: "sequence-classifier-ws"
  # Queue to place the pods in
  queue: "root.namespace"

# Cache type
# Valid values: none, hbase, dragonfly
cache: none

#Configuration for hbase cache
hbase: 
  url:
  port:
  table:

#Configuration for dragonfly cache
dragonfly:
  url:
  port:

#Configuration for the vsearch instance. Full URL of the batch endpoint,
#including scheme and path.
vsearch:
  url: "http://vsearch:8000/search/batch"
  # Per-request timeout, ms. Timeouts are not retried, so allow for a request
  # waiting behind others on a busy replica.
  timeoutMs: 120000
  # Sequences per vsearch request. Throughput per replica barely changes with
  # batch size (measured 25-200), so keep requests small for latency.
  batchSize: 25
  # vsearch requests in flight per pod. Each vsearch replica serves one
  # request at a time, and the Service spreads connections randomly, so use
  # about twice the number of vsearch replicas to keep all of them busy.
  concurrency: 4
  # Extra attempts per request failing with a network error or 5xx
  # (timeouts are not retried)
  retries: 2

#Name of the table for the cache
dbName: sequenceCache

#Version of the reference database (.udb) and vsearch parameters. Part of every
#cache key: bump it whenever either changes, or stale results are served.
referenceDbVersion: ""

#Hits kept per sequence in the cache
cacheTopN: 10
#Timeout per cache round-trip, ms
cacheTimeoutMs: 1000

#How long a pod waits for in-flight requests on shutdown, ms
shutdownTimeoutMs: 150000