apiVersion: v1
kind: Service
metadata:
  name: {{ include "helpers.releaseName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "helpers.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "helpers.releaseName" . }}-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helpers.labels" . | nindent 4 }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort  }}
      nodePort: {{ .Values.service.nodePort  }}
      protocol: TCP
      name: http
  selector:
    {{- include "helpers.selectorLabels" . | nindent 4 }}