kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "helpers.releaseName" . }}-conf
  namespace: {{ .Release.Namespace }}
data:
  VSEARCH_URL: {{ .Values.vsearch.url | quote }}
  PORT: {{ .Values.service.port | quote}}
  DB_NAME: {{ .Values.dbName | quote}}
  CACHE: {{ .Values.cache | quote}}
  {{- if eq .Values.cache "hbase" }}
  HBASE_URL: {{ .Values.hbase.url | quote }}
  HBASE_PORT: {{ .Values.hbase.port | quote }}
  HBASE_TABLE: {{ .Values.hbase.table | quote }}
  {{- end }}
  {{- if eq .Values.cache "dragonfly" }}
  DRAGONFLY_URL: {{ .Values.dragonfly.url | quote }}
  DRAGONFLY_PORT: {{ .Values.dragonfly.port | quote }}
  {{- end }}
  VSEARCH_TIMEOUT_MS: {{ .Values.vsearch.timeoutMs | quote }}
  VSEARCH_BATCH_SIZE: {{ .Values.vsearch.batchSize | quote }}
  VSEARCH_CONCURRENCY: {{ .Values.vsearch.concurrency | quote }}
  VSEARCH_RETRIES: {{ .Values.vsearch.retries | quote }}
  REFERENCE_DB_VERSION: {{ required "referenceDbVersion is required: it versions the cache" .Values.referenceDbVersion | quote }}
  CACHE_TOP_N: {{ .Values.cacheTopN | quote }}
  CACHE_TIMEOUT_MS: {{ .Values.cacheTimeoutMs | quote }}
  SHUTDOWN_TIMEOUT_MS: {{ .Values.shutdownTimeoutMs | quote }}